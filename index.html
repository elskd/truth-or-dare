<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Только между нами</title>
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
<div id="loader" class="loader">
  <div class="loader-title">Правда или<br>Действие</div>
  <div class="loader-bottom"><div class="loader-line"><i></i></div><span>Готовим вопросы...</span></div>
</div>

<main class="app">
<section id="homeView" class="view active">
  <header class="topbar"><h1 class="page-title">Главная</h1><button class="icon-btn" id="settingsTop" aria-label="Настройки">⚙︎</button></header>
  <div class="count-badge"><b id="playerCount">2</b><span>игрока</span></div>
  <div id="playersList" class="players-list"></div>
  <button class="add-player" id="addPlayer" aria-label="Добавить игрока">+</button>
  <button class="primary" id="startSetup"><span class="btn-label">Начать игру</span><span class="btn-icon">↗</span></button>
</section>

<section id="settingsView" class="view">
  <button class="back-btn" id="settingsBack">‹</button>
  <h2 class="page-title">Установи правила</h2>
  <div class="section-label">Режим</div>
  <div class="mode-grid" id="modeGrid">
    <button class="mode-card active" data-mode="classic"><b>Классика</b><small>Легко и по-доброму</small></button>
    <button class="mode-card" data-mode="spicy"><b>Остро</b><small>Чуть-чуть флирта</small></button>
    <button class="mode-card" data-mode="wild"><b>Дико</b><small>Без стеснения</small></button>
    <button class="mode-card" data-mode="inferno"><b>Инферно</b><small>Для взрослых</small></button>
  </div>
  <div class="section-label count-label">Количество вопросов</div>
  <div class="count-grid" id="countGrid">
    <button class="count-btn active" data-count="20">20</button>
    <button class="count-btn" data-count="50">50</button>
    <button class="count-btn" data-count="75">75</button>
    <button class="count-btn" data-count="100">100</button>
  </div>
  <button class="primary bottom-button" id="launchGame"><span class="btn-label">Запустить игру</span><span class="btn-icon">→</span></button>
</section>

<section id="turnView" class="view">
  <button class="back-btn" id="turnBack">‹</button>
  <div class="turn-label">Сейчас играет</div>
  <div class="turn-row">
    <h2 id="turnPlayer" class="page-title turn-player"></h2>
    <div class="turn-number">Ход <b id="turnNumber">1</b></div>
  </div>
  <div class="choice-grid">
    <button class="choice-card" data-choice="truth"><span class="choice-title">Правда</span><span class="choice-subtitle">Нажми, чтобы играть</span></button>
    <button class="choice-card" data-choice="dare"><span class="choice-title">Действие</span><span class="choice-subtitle">Нажми, чтобы играть</span></button>
    <button class="choice-card random-card" data-choice="random"><span class="choice-title">Случайно</span><span class="choice-subtitle">Нажми, чтобы играть</span></button>
  </div>
</section>

<section id="questionView" class="view">
  <button class="back-btn" id="questionBack">‹</button>
  <div class="question-meta"><span id="questionPlayer"></span><span id="questionProgress">01 / 20</span></div>
  <div class="question-level" id="questionLevel"></div>
  <div class="question-type" id="questionType"></div>
  <div class="question-text" id="questionText"></div>
  <div class="question-actions">
    <button class="secondary" id="replaceBtn">↻ &nbsp;Заменить</button>
    <button class="primary next-button" id="nextQuestion"><span class="btn-label">Далее</span><span class="btn-icon">▶</span></button>
  </div>
</section>

<section id="finishView" class="view">
  <div class="finish">
    <div class="question-type">Готово</div>
    <h2 class="page-title">Ночь<br>удалась.</h2>
    <p id="finishText"></p>
    <button class="primary" id="againBtn"><span class="btn-label">Сыграть ещё</span><span class="btn-icon">↻</span></button>
  </div>
</section>
</main>
<script src="app.js?v=19"></script>
</body>
</html>
