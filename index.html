<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Правда или Действие</title>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div id="loader" class="loader">
  <div class="loader-title">Правда или<br>Действие</div>
  <div class="loader-bottom"><div class="loader-line"><i></i></div><span>Готовим вопросы...</span></div>
</div>

<main class="app">
<section id="homeView" class="view active">
  <header class="home-head"><h1>ГЛАВНАЯ</h1><button class="gear" id="settingsTop">⚙</button></header>
  <div class="players-badge"><b id="playerCount">2</b> ИГРОКИ</div>
  <div id="playersList" class="players-list"></div>
  <button class="add-player" id="addPlayer">+</button>
  <button class="big-button" id="startSetup">НАЧАТЬ ИГРУ <span>↗</span></button>
</section>

<section id="settingsView" class="view">
  <button class="back-circle" id="settingsBack">‹</button>
  <h2 class="settings-title">УСТАНОВИ<br>ПРАВИЛА</h2>

  <div class="label">РЕЖИМ</div>
  <div class="mode-grid" id="modeGrid">
    <button class="mode-card active" data-mode="classic"><strong>Классика</strong><small>Легко и по-доброму</small></button>
    <button class="mode-card" data-mode="spicy"><strong>Остро</strong><small>Чуть-чуть флирта и жара</small></button>
    <button class="mode-card" data-mode="wild"><strong>Дико</strong><small>Без стеснения</small></button>
    <button class="mode-card" data-mode="inferno"><strong>Инферно</strong><small>Только для взрослых</small></button>
  </div>

  <div class="label count-label">КОЛИЧЕСТВО ВОПРОСОВ</div>
  <div class="count-grid" id="countGrid">
    <button class="count-btn active" data-count="20">20</button>
    <button class="count-btn" data-count="50">50</button>
    <button class="count-btn" data-count="75">75</button>
    <button class="count-btn" data-count="100">100</button>
  </div>
  <button class="big-button" id="launchGame">ЗАПУСТИТЬ ИГРУ <span>→</span></button>
</section>

<section id="turnView" class="view">
  <button class="back-circle" id="turnBack">‹</button>
  <div class="turn-top"><span>СЕЙЧАС ИГРАЕТ</span><small>ХОД<br><b id="turnNumber">1</b></small></div>
  <h2 id="turnPlayer" class="turn-player">Никита</h2>
  <div class="choice-grid">
    <button class="choice-card" data-choice="truth"><div class="choice-icon">“</div><strong>Правда</strong><small>Нажми, чтобы играть</small></button>
    <button class="choice-card" data-choice="dare"><div class="choice-icon lightning">ϟ</div><strong>Действие</strong><small>Нажми, чтобы играть</small></button>
    <button class="choice-card random-card" data-choice="random"><div class="choice-icon">⤨</div><strong>Случайно</strong><small>Нажми, чтобы играть</small></button>
  </div>
</section>

<section id="questionView" class="view">
  <button class="back-circle" id="questionBack">‹</button>
  <div class="question-top"><span id="questionPlayer">Никита</span><small id="questionProgress">01 / 20</small></div>
  <div class="question-level" id="questionLevel">УРОВЕНЬ 1</div>
  <div class="question-type" id="questionType">ПРАВДА</div>
  <div class="question-text" id="questionText"></div>
  <div class="question-actions"><button class="replace-btn" id="replaceBtn">↻ &nbsp;ЗАМЕНИТЬ</button><button class="big-button next-q" id="nextQuestion">ДАЛЕЕ <span>▶▶</span></button></div>
</section>

<section id="finishView" class="view">
  <div class="finish-center"><div class="question-type">ГОТОВО</div><h2>Ночь<br>удалась.</h2><p id="finishText"></p><button class="big-button" id="againBtn">СЫГРАТЬ ЕЩЁ <span>↻</span></button></div>
</section>
</main>
<script src="app.js?v=6"></script>
</body>
</html>
